<!doctype html>
<!-- `theme-platform` is the instance default; a hosted page sets its app's theme on its own frame. -->
<html lang="en" class="theme-platform">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Identity</title>
    <!-- The fe sdk pre-paint colour script, generated by vite.config.ts: applies the remembered mode before paint. -->
    <script vite-ignore src="/theme.js"></script>
  </head>
  <body class="bg-background text-foreground">
    <div id="root"></div>
    <script type="module" src="/src/bootstrap/main.ts"></script>
  </body>
</html>
