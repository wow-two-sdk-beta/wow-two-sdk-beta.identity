# Local verification only. Bring up from engineering/deployment/ (or from the repo root with
# `docker compose -p identity-local -f engineering/deployment/docker-compose.yml up -d --build`):
#
#   docker compose up -d --build     the database and the service; the service answers on http://127.0.0.1:8389
#
# The database credentials are local-only test values and the database stays on the compose network; a deployed
# environment's connection string comes from its Wheelhouse target, which fills it from the target's own database. The
# image boots as Production, which only verifies the identity schema, so identity-migrate applies it first with the
# image's own migrate command, as a deploy step would. Production also refuses ephemeral OIDC keys and an unwrapped
# Data Protection ring, so identity-keys makes throwaway certificates once with the image's keys command and the
# service reads them as file paths; a deployed target pastes the owner's bundles into vault secrets instead. Remove the
# identity-keys volume to make new ones. Each image runs under an init process, as on a target, so a refused boot exits
# instead of spinning as PID 1.
#
# The service sends its emails (account confirmation, password reset, password-change codes and links) to Mailpit, a
# local mail sink, until wow2's dev mailboxes exist: identity.mailpit.env holds the relay settings, nothing leaves the
# machine, and http://127.0.0.1:8025 shows every message. Mailpit is a separate container, not part of the service: the
# runtime ships no test mode, fake channel or message sink. To send through wow2's dev sender, set the same keys in
# identity.local.env (below), which is read after identity.mailpit.env and wins; an environment: entry would beat both,
# so none sets an email key. identity-keys also makes the key that signs the service's confirmation and reset tokens.
# Sign-up is on
# here, so a local sign-up produces a confirmation email to read; a deployed environment turns it on in its own settings.
#
# The service runs as a local run (Development without DEPLOY_ENVIRONMENT), which the bot's polling needs: a deployed boot
# refuses it. Development would also switch on the throwaway OIDC keys, so the two ephemeral switches are set off and the
# service keeps reading the certificates identity-keys made.
#
# The image's own verbs run against this stack's settings without serving, each ending in one result line:
#
#   docker compose run --rm identity config check
#   docker compose run --rm identity admin create --slug ocharo --name Ocharo --display-name "Lola Karimova" --phone +998901234567
#
# admin create makes the first organization and its owner (owner role, no password), and answers present on a rerun.
#
# The bot is off here. To sign in by phone locally, give the stack the local dev bot: put its secrets in identity.local.env
# beside this file (optional, gitignored). Make it in your own terminal or editor, never through a chat, and keep the
# token out of any message or command a chat runs:
#   touch identity.local.env && chmod 600 identity.local.env
# then add, in an editor, for wow2's dev bot (it polls here, so no hosted instance may have set a webhook on it, or
# polling answers 409):
#   Identity__Telegram__IsEnabled=true
#   Identity__Telegram__BotUserName=<the bot's user name>
#   Identity__Telegram__BotToken=<the token BotFather gave>
# and, for wow2's dev sender instead of Mailpit (the password is typed in the editor like the token):
#   Identity__Email__From=<the sender's address>
#   Identity__Email__FromName=<its display name>
#   Identity__Email__Smtp__Host=<the relay host>
#   Identity__Email__Smtp__Port=<the relay port>
#   Identity__Email__Smtp__SecureSocket=<None, Auto, SslOnConnect, StartTls or StartTlsWhenAvailable>
#   Identity__Email__Smtp__Username=<the relay user>
#   Identity__Email__Smtp__Password=<the relay password or key>
# Add Identity__Phone__AllowedCountries__0=UZ (one line per country) to limit the numbers; then `docker compose up -d`.
services:
  database:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: identity
      POSTGRES_USER: identity
      POSTGRES_PASSWORD: identity
    volumes:
      - database:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U identity -d identity"]
      interval: 5s
      timeout: 3s
      retries: 20

  mailpit:
    image: axllent/mailpit:v1.32.0
    init: true
    restart: unless-stopped
    ports:
      - "127.0.0.1:8025:8025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 5s
      timeout: 3s
      retries: 20
    mem_limit: 128m

  identity-keys:
    image: identity:local
    init: true
    build:
      context: ../codebase
      dockerfile: ../deployment/Dockerfile
    entrypoint: ["sh", "-c"]
    command:
      - >-
        mkdir -p /data/keys && chmod 700 /data/keys && cd /data/keys
        && { [ -s signing.pem ] || dotnet /app/Identity.Api.dll keys generate --role signing > signing.pem; }
        && { [ -s encryption.pem ] || dotnet /app/Identity.Api.dll keys generate --role encryption > encryption.pem; }
        && { [ -s data-protection.pem ] || dotnet /app/Identity.Api.dll keys generate --role data-protection > data-protection.pem; }
        && { [ -s token.key ] || head -c 32 /dev/urandom | base64 > token.key; }
    volumes:
      - identity-keys:/data

  identity-migrate:
    image: identity:local
    init: true
    command: ["migrate"]
    environment:
      DB_CONNECTION: "Host=database;Database=identity;Username=identity;Password=identity"
    depends_on:
      database:
        condition: service_healthy

  identity:
    image: identity:local
    init: true
    depends_on:
      identity-keys:
        condition: service_completed_successfully
      identity-migrate:
        condition: service_completed_successfully
      mailpit:
        condition: service_healthy
    restart: unless-stopped
    ports:
      - "127.0.0.1:8389:8080"
    env_file:
      - path: identity.mailpit.env
      - path: identity.local.env
        required: false
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      DB_CONNECTION: "Host=database;Database=identity;Username=identity;Password=identity"
      Identity__Server__Issuer: http://127.0.0.1:8389/
      Identity__Server__Keys__IsEphemeral: "false"
      Identity__Tokens__IsKeyEphemeral: "false"
      Identity__Telegram__UpdateMode: Polling
      Identity__Server__Keys__Signing__0: /data/keys/signing.pem
      Identity__Server__Keys__Encryption__0: /data/keys/encryption.pem
      Identity__DataProtection__Certificates__0: /data/keys/data-protection.pem
      Identity__Tokens__SigningKey: /data/keys/token.key
      Identity__SignUp__IsEnabled: "true"
    volumes:
      - identity-keys:/data
    mem_limit: 256m

volumes:
  database:
  identity-keys:
