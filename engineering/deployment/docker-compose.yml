# Local verification only. Bring up from engineering/deployment/:
#
#   docker compose up -d --build     the service answers on http://127.0.0.1:8389
#
# The SQLite file lives on the named volume, so data survives container replacement. A deployed environment's path
# comes from its Wheelhouse target settings, never from here. The image boots as Production, which only verifies the
# identity schema, so identity-migrate applies it first with the image's own migrate command, as a deploy step would.
# Production also refuses ephemeral OIDC keys, so identity-keys makes throwaway certificates on the volume once with
# the image's keys command; a deployed target lists the owner's files instead. Remove the volume to make new ones.
services:
  identity-keys:
    image: identity:local
    build:
      context: ../codebase
      dockerfile: ../deployment/Dockerfile
    entrypoint: ["sh", "-c"]
    command:
      - >-
        mkdir -p /data/keys && chmod 700 /data/keys && cd /data/keys
        && { [ -s signing.pem ] || dotnet /app/Identity.Api.dll keys generate --role signing > signing.pem; }
        && { [ -s encryption.pem ] || dotnet /app/Identity.Api.dll keys generate --role encryption > encryption.pem; }
    volumes:
      - identity-data:/data

  identity-migrate:
    image: identity:local
    command: ["migrate"]
    environment:
      DB_CONNECTION: "Data Source=/data/identity.db"
    volumes:
      - identity-data:/data

  identity:
    image: identity:local
    depends_on:
      identity-keys:
        condition: service_completed_successfully
      identity-migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    ports:
      - "127.0.0.1:8389:8080"
    environment:
      DB_CONNECTION: "Data Source=/data/identity.db"
      DataProtection__KeyDirectory: /data/data-protection
      Identity__Server__Keys__Signing__0: /data/keys/signing.pem
      Identity__Server__Keys__Encryption__0: /data/keys/encryption.pem
    volumes:
      - identity-data:/data

volumes:
  identity-data:
