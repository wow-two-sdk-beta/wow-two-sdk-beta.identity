# yaml-language-server: $schema=../../../../../conventions/deployment/descriptor/deploy.schema.json
# What the Identity domain deploys: one service hosting the Form 1 module, its HTTP API, the hosted pages and the admin
# console. Format and rules: wow-two-ws/conventions/deployment/descriptor/deploy-descriptor.md. Hostnames, secrets
# and environments live in Wheelhouse targets, never here. Paths are relative to engineering/.
descriptor: 2
product: identity
# What the console and every other reader call it (pipelines v0.11.0); it replaced product/product.json.
name: Identity
description: Sign-in, accounts and member access for every product.
platform: linux/amd64
# Dev runs as .NET Development, prod as Production; appsettings.Development.json holds defaults only, and an IDE
# run's own values live in appsettings.Local.json.
dotnetEnvironment: true
# The dev check: once a dev rollout succeeds, the service's own image asks it for its health and its status over the
# platform network. A pass lets auto-promote take the release. Each request carries the probe Host (localhost): a
# target's AllowedHosts names its public hosts plus localhost, so the service's platform-network name in the URL
# would answer 400 from host filtering.
verify:
  service: identity
  command:
    - sh
    - -c
    - >-
      curl --fail --silent --show-error --max-time 10 --header "Host: localhost" --output /dev/null
      "$VERIFY_SERVICE_IDENTITY/health"
      && curl --fail --silent --show-error --max-time 10 --header "Host: localhost" --output /dev/null
      "$VERIFY_SERVICE_IDENTITY/api/system/status"
      && echo "health and status answered"
  timeout: 1m
# The migrate step (pipelines v0.12.0): on every forward deploy, after the pull and before the service restarts, the
# runner runs the image's bare `migrate` (apply, then seed) in a one-off container with the service's settings plus
# Migrations:ConnectionString, which it fills from the target's database and the be sdk verbs connect the identity set
# through. A deployed boot only verifies the set's level; a return to an older release runs that release's
# `migrate check` first. The publish runs `migrate sets --json` offline and records the set in the bundle.
migrate:
  - service: identity
    command: [dotnet, Identity.Api.dll, migrate]
    timeout: 10m
# The config check step (descriptor convention, § Config check): the image's own `config check` runs in a one-off
# container with the settings the deploy applies, after migrate and before the first wave, and on every settings-only
# apply, so a bad setting, a retired key or a stranding change stops the deploy with the old release still serving. It
# starts no listener and writes nothing. Held back: the newest pipelines release (v0.14.0) still refuses the key
# ("Unknown top-level key: configCheck") and the runner gets it with Wheelhouse v0.13; uncomment the item with the
# first pipelines release that accepts it.
# configCheck:
#   - service: identity
#     command: [dotnet, Identity.Api.dll, config, check]
#     timeout: 2m
# Two host roles: the public front door for the API and the hosted pages, and the private admin console. One app
# serves both; Wheelhouse binds each site to its own host per environment.
sites:
  app: { primary: true }
  console: { exposure: private }
shared:
  - codebase/identity.backend-services/Directory.*.props
  - codebase/identity.backend-services/global.json
services:
  identity:
    build:
      dockerfile: deployment/Dockerfile
    paths:
      - codebase/identity.backend-services/**
      - codebase/identity.frontend-services/**
    health: /health
    memory: 256m
    # Typed keys (since pipelines v0.10.0): Wheelhouse checks each saved value against its type; a required key joins
    # settings.required. The service needs the target's PostgreSQL database: Wheelhouse fills the connection string
    # from it, and the name ends in ConnectionString, so the value stays in its vault. The OIDC server pins its issuer
    # and reads one signing and one encryption certificate at least (a rotation adds :1, :2 …); a deployed boot refuses
    # ephemeral keys, so the default turns off what appsettings.Development.json turns on for a local run. Every
    # certificate value is the PEM bundle `keys generate` prints, pasted as is: a vault secret the settings render
    # carries, never a file on a volume. The Data Protection ring lives in the database, wrapped by its own
    # certificate (`keys generate --role data-protection`); a deployed boot refuses to start without one. Clients
    # (Identity:Server:Clients:N:…) are owner keys, added per environment. Self sign-up stays off unless an environment
    # turns it on: off, POST /api/account/sign-up answers 403; the first owner comes from the image's `admin create`.
    #
    # Generated keys (pipelines v0.14.0): Wheelhouse makes each secret once per environment from random bytes, so no
    # person or agent sees it. The purpose-token key and the one-time-code key take base64url (padding optional) or
    # standard base64 of at least 32 bytes; every instance on one database needs the same value. The code key is
    # generated even while the Telegram bot is off, so turning the bot on needs no extra secret.
    #
    # Owner keys: the SMTP relay (Identity:Email) is optional, since with no Smtp:Host the instance boots and skips and
    # logs every send, and each of its keys is set per environment. The bot (Identity:Telegram) is off by default; on,
    # it needs BotToken and BotUserName, a deployed boot registers the webhook itself (UpdateMode Polling is for a
    # local run only, so a deployed boot refuses it) and each environment needs a bot of its own. The hosted pages' one look
    # per instance (Identity:Pages; no client overrides it) falls back to appsettings.json (BrandName Identity, Theme platform).
    settings:
      keys:
        DatabaseSettings:ConnectionString: { required: true }
        Identity:Server:Issuer: { type: url, required: true }
        Identity:Server:Keys:IsEphemeral: { type: boolean, default: false }
        Identity:SignUp:IsEnabled: { type: boolean, default: false }
        Identity:Server:Keys:Signing:0: { secret: true, required: true }
        Identity:Server:Keys:Encryption:0: { secret: true, required: true }
        Identity:DataProtection:Certificates:0: { secret: true, required: true }
        Identity:Tokens:SigningKey: { secret: true, required: true, generate: { random: 32 } }
        Identity:Otp:HashKey: { secret: true, generate: { random: 32 } }
        Identity:Email:From: { type: email }
        Identity:Email:FromName: {}
        Identity:Email:Smtp:Host: {}
        Identity:Email:Smtp:Port: { type: number }
        Identity:Email:Smtp:SecureSocket: { type: choice, values: [None, Auto, SslOnConnect, StartTls, StartTlsWhenAvailable] }
        Identity:Email:Smtp:Username: {}
        Identity:Email:Smtp:Password: { secret: true }
        Identity:Password:Change:Confirmation: { type: choice, values: [None, Code, Link], default: None }
        Identity:Telegram:IsEnabled: { type: boolean, default: false }
        Identity:Telegram:BotToken: { secret: true }
        Identity:Telegram:BotUserName: {}
        Identity:Telegram:WebhookSecret: { secret: true, generate: { random: 32, encoding: hex } }
        Identity:Telegram:UpdateMode: { type: choice, values: [Webhook, Polling], default: Webhook }
        Identity:Phone:AllowedCountries:0: {}
        Identity:Pages:BrandName: {}
        Identity:Pages:Theme: {}
        Identity:Pages:BackgroundUrl: {}
    needs: [postgres]
    # The pages at /, the contract's HTTP mirror under the same host's /api: /api routes ahead of /, never /apiary.
    sites:
      app: { paths: [/, /api] }
      console: { paths: [/, /api] }
